services:
    rustfs:
        image: rustfs/rustfs:latest
        restart: unless-stopped
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: ":9000"
            RUSTFS_CONSOLE_ADDRESS: ":9001"
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-ngumpulrustfs}
            RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-ngumpul-rustfs-local-secret-change-me-32}
            RUSTFS_CORS_ALLOWED_ORIGINS: ${CORS_ORIGIN:-http://localhost:5173}
        ports:
            - "127.0.0.1:9000:9000"
            - "127.0.0.1:9001:9001"
        volumes:
            - rustfs_data:/data
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-pbp_server}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
            - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

    app:
        build: .
        restart: unless-stopped
        stop_grace_period: 25s
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready', { signal: AbortSignal.timeout(3500) }).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 20s
        environment:
            NODE_ENV: production
            PORT: 3000
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
            BETTER_AUTH_EXPO_SCHEME: ${BETTER_AUTH_EXPO_SCHEME:-ngumpul}
            BETTER_AUTH_ELECTRON_SCHEME: ${BETTER_AUTH_ELECTRON_SCHEME:-id.my.afadhili.ngumpul}
            BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY:-}
            DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pbp_server}}
            CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
            SMTP_HOST: ${SMTP_HOST_DOCKER:-mailpit}
            SMTP_PORT: ${SMTP_PORT_DOCKER:-1025}
            SMTP_SECURE: ${SMTP_SECURE:-false}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            EMAIL_FROM: ${EMAIL_FROM:-Ngumpul <no-reply@localhost>}
            REDIS_URL: redis://redis:6379
            LIVEKIT_URL: ws://livekit:7880
            LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
            LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
            LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
            S3_BUCKET: ${S3_BUCKET:-pbp-attachments}
            S3_REGION: ${S3_REGION:-us-east-1}
            S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://rustfs:9000}
            S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ngumpulrustfs}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ngumpul-rustfs-local-secret-change-me-32}
            S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
        # Intentionally no host port: Cloudflare Tunnel reaches the app at
        # app:3000 over the Compose network. Publishing 3000 here caused a
        # boot-time conflict with another local project and left the app down.
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
            rustfs:
                condition: service_healthy
            mailpit:
                condition: service_started

    cloudflared:
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        profiles: ["tunnel"]
        command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
        volumes:
            - ./cloudflared:/etc/cloudflared:ro
        depends_on:
            - app
            - livekit
            - rustfs

    livekit:
        image: livekit/livekit-server:latest
        restart: unless-stopped
        command: ["--config", "/etc/livekit.yaml"]
        environment:
            LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}"
        ports:
            - "7880:7880/tcp"
            - "7881:7881/tcp"
            - "50000-50100:50000-50100/udp"
        volumes:
            - ./livekit.yaml:/etc/livekit.yaml:ro
        depends_on:
            redis:
                condition: service_healthy

volumes:
    postgres_data:
    redis_data:
    rustfs_data:
